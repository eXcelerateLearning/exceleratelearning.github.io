<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Engaged Learning Toolkit | eXcelerate Learning</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #16162A; --surface: #1E1E38;
    --pink: #FF00FB; --blue: #02A9EB;
    --fg1: #FFFFFF; --fg2: #9B9BC4;
    --border: rgba(255,255,255,0.07);
  }
  html, body { height: 100%; background: var(--bg); font-family: 'Open Sans', sans-serif; overflow: hidden; }

  .bar {
    display: flex; align-items: center; gap: 12px;
    height: 56px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .bar img { height: 28px; }
  .bar .title { color: var(--fg1); font-size: 14px; font-weight: 600; }
  .bar .tag {
    margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--fg2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 10px;
  }

  .frame-wrap { position: relative; width: 100%; height: calc(100% - 56px); background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--fg2); font-size: 13px; letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<div class="bar">
  <img src="../../assets/eXcelerate_Learning_white_text_logo.png" alt="eXcelerate Learning">
  <span class="title">Community Engaged Learning Toolkit</span>
  <span class="tag">Preview build</span>
</div>

<div class="frame-wrap">
  <div class="loading" id="loading">Loading course&hellip;</div>
  <iframe id="course-frame" src="course/index_lms.html" allow="autoplay" onload="document.getElementById('loading').style.display='none'"></iframe>
</div>

<!-- scorm-again: provides a SCORM 2004 API so the course runs without console errors.
     Memory-only mode for this preview build — no data is stored or sent anywhere.
     Swap this block for a real Supabase-backed API once login/progress tracking is added. -->
<script src="https://cdn.jsdelivr.net/npm/scorm-again@latest/dist/scorm-again.min.js"></script>
<script>
  window.API_1484_11 = new Scorm2004API({
    autocommit: false,
    logLevel: 4
  });
</script>

</body>
</html>
